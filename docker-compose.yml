services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockerp
      POSTGRES_USER: stockerp
      POSTGRES_PASSWORD: stockerp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockerp -d stockerp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stockerp_postgres:/var/lib/postgresql/data

volumes:
  stockerp_postgres:
